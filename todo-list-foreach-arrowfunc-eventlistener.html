<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo List</title>
  <link rel="icon" href="fav.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin : 0 0;
      padding: 0 0;
      font-family: Nunito;
    }
    body {
      padding: 50px 50px;
    }
    .title-p {
      text-align: center;
      margin-bottom: 100px;
      font-size: 50px;
    }
    .first-row-container, .task-style {
      display: grid;
      grid-template-columns: 300px 200px 100px;
      column-gap: 20px;
      margin: auto 23%;
      row-gap: 20px;
    }
    .first-row-container {
      margin-bottom: 20px;
    }
    .first-row-container input {
      font-size: 16px;
    }
    .first-row-container input, .task-style div {
      padding: 10px 15px;
      border-radius: 10px;
      border: none;
      background-color: rgb(240, 239, 239);
    }
    .del-but, .add-but {
      color: white;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      font-size: 16px;
    }
    .del-but {
      background-color: rgb(179, 7, 7);
    }
    .add-but {
      background-color: rgb(8, 184, 8);
    }
  </style>
</head>
<body>
  <p class="title-p">Todo List</p>
  <div class="first-row-container">
    <input type="text" placeholder="Enter the task" class="input-task">
    <input type="date" class="calender">
    <button class="add-but js-add-button">Add</button>
  </div>
  <div class="task-print-container-js task-style"></div>
</body>
<script>
  document.querySelector('.js-add-button').addEventListener('click', () => {addButton();});
  let taskList = JSON.parse(localStorage.getItem('list')) || [];
  forloop()
  function addButton() {
    const smallcod = document.querySelector('.input-task');
    const smallcod2 = document.querySelector('.calender');
    const userTask = smallcod.value;
    const userdate = smallcod2.value;
    taskList.push({name: userTask, duedate: userdate});
    smallcod.value = '';
    forloop();
  }

  function forloop() {
    let printlist = '';
    taskList.forEach((taskList, i) => {
      const {name, duedate} = taskList;
      const par = `<div>${name}</div>
        <div>${duedate}</div>
        <button class= 'del-but js-del-button'>Delete</button>`;
      printlist += par;
    })
    
    
    const smalldiv = document.querySelector('.task-print-container-js');
    smalldiv.innerHTML = printlist;
    document.querySelectorAll('.js-del-button')
      .forEach((delbut, i) => {
        delbut.addEventListener('click',  () => {taskList.splice(i,1);
        forloop();
        } )
    });
    
    localStorage.setItem('list', JSON.stringify(taskList))
  };
   
</script>
</html>
